<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nainshree 💖</title>
<style>
:root{--bg:#fff0f3;--fg:#7a1230;--heart1:#ff4d6d;--heart2:#c9184a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0910;--fg:#ffd6df}}
:root[data-theme="dark"]{--bg:#1a0910;--fg:#ffd6df}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.stage{position:relative;width:min(80vw,340px);aspect-ratio:200/180;perspective:900px;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:beat 1.4s infinite}
.stage.open{animation:none}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.06)}30%{transform:scale(1)}45%{transform:scale(1.04)}}
.half{position:absolute;inset:0;transition:transform 1s cubic-bezier(.5,0,.2,1)}
.half svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 14px rgba(201,24,74,.35))}
.l{clip-path:inset(0 50% 0 0);transform-origin:0% 50%}
.r{clip-path:inset(0 0 0 50%);transform-origin:100% 50%}
.open .l{transform:rotateY(-105deg)}
.open .r{transform:rotateY(105deg)}
.inside{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:scale(.6);transition:opacity .8s .4s,transform .8s .4s;pointer-events:none}
.open .inside{opacity:1;transform:scale(1)}
.inside b{font-size:clamp(26px,9vw,42px);color:var(--heart2)}
.inside span{font-size:clamp(14px,4.5vw,18px);margin-top:6px}
.hint{margin-top:28px;font-size:15px;opacity:.75;transition:opacity .4s}
.open ~ .hint{opacity:0}
.float{position:fixed;bottom:-30px;font-size:22px;animation:up 3.5s linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div class="stage" id="s">
  <div class="inside"><b>Nainshree</b><span>This is for you 💖</span></div>
  <div class="half l" id="hl"></div>
  <div class="half r" id="hr"></div>
</div>
<div class="hint">Dil ko tap karo ✨</div>
<script>
var svg='<svg viewBox="0 0 200 180"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff758f"/><stop offset="1" stop-color="#c9184a"/></linearGradient></defs><path d="M100 170 C20 110 0 60 40 25 C70 0 100 20 100 45 C100 20 130 0 160 25 C200 60 180 110 100 170Z" fill="url(#g)"/></svg>';
document.getElementById('hl').innerHTML=svg;
document.getElementById('hr').innerHTML=svg.replace('id="g"','id="g2"').replace('url(#g)','url(#g2)');
var s=document.getElementById('s');
s.addEventListener('click',function(){
  s.classList.toggle('open');
  if(s.classList.contains('open')){
    for(var i=0;i<14;i++){(function(i){setTimeout(function(){
      var e=document.createElement('div');e.className='float';e.textContent=['💖','💗','💕','✨'][i%4];
      e.style.left=(Math.random()*90+3)+'%';document.body.appendChild(e);
      setTimeout(function(){e.remove()},3600);},i*150)})(i);}
  }
});
</script>
</body>
</html>
